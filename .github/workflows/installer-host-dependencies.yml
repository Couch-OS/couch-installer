name: Installer host dependencies
# Reusable: installer-binaries.yml calls this for every change and its
# admission job requires it. Dispatch it directly to rerun it alone.
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adb:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test dependency validation
        run: python -m unittest discover -s tools/installer -p test_host_dependencies.py -v
      - name: Download, verify and execute official ADB version
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'couch-adb-verified'
          subprocess.run([sys.executable, 'tools/installer/pins/host_dependencies.py',
                          '--output', str(output), '--smoke'], check=True, timeout=300)
          # No dependency binary, vendor input or private session is uploaded.
